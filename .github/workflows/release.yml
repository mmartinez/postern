name: release

# Release-please drives versioning. Conventional-commit pushes to main keep a
# Release PR up to date (version bump + CHANGELOG); merging that PR creates the
# tag and GitHub Release. The goreleaser job runs in the SAME workflow run,
# gated on release_created — the default GITHUB_TOKEN cannot trigger a separate
# tag-triggered workflow, so the build runs here rather than via on:push:tags.
# release-please owns the release body (CHANGELOG); goreleaser uploads the
# binaries, checksums, SBOMs, cosign bundle and image onto it
# (release.mode: keep-existing in .goreleaser.yaml).
on:
  push:
    branches:
      - main

permissions:
  contents: write # release-please: open/update the Release PR and create the release/tag; goreleaser: upload assets
  pull-requests: write # release-please: manage the Release PR
  packages: write # goreleaser: push the image to ghcr.io
  id-token: write # goreleaser: keyless cosign signing via GitHub OIDC

env:
  GO_VERSION: "1.26.5"
  # Kept in lockstep with .github/workflows/ci.yml and .mise.toml.
  GORELEASER_VERSION: "v2.16.0"
  ZIG_VERSION: "0.14.0"
  ZIG_SHA256: "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # config-file and manifest-file default to release-please-config.json
          # and .release-please-manifest.json at the repo root.

  goreleaser:
    name: goreleaser
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact commit release-please tagged, not the branch head.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4
      - name: install zig (cross C compiler for the CGO matrix)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0
      - name: install cosign (keyless signing)
        uses: sigstore/cosign-installer@v3
      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
