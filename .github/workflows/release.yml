name: release

# Release-please drives versioning. Conventional-commit pushes to main keep a
# Release PR up to date (version bump + CHANGELOG); merging that PR creates the
# tag and GitHub Release. The goreleaser jobs run in the SAME workflow run,
# gated on release_created — the default GITHUB_TOKEN cannot trigger a separate
# tag-triggered workflow, so the build runs here rather than via on:push:tags.
#
# Split build (OSS goreleaser has no native split/merge — that is Pro-only):
#   1. goreleaser-darwin builds the darwin targets natively on a macos runner
#      (cgo against Security.framework needs the real macOS SDK) and uploads
#      its archives, SBOMs and checksum slice as a workflow artifact. It does
#      not publish anything.
#   2. goreleaser (ubuntu) keeps the linux builds, docker push/manifest signing,
#      and publishes to the release; then it merges the darwin checksum slice
#      into checksums.txt, signs the merged file with keyless cosign, and
#      uploads it plus the darwin assets. Signing happens only after the merge:
#      the bundle must cover every artifact by digest, and each single run's
#      checksums.txt covers only its own half.
#
# release-please owns the release body (CHANGELOG)
# (release.mode: keep-existing in .goreleaser.yaml).
#
# workflow_dispatch re-runs the build jobs against a tag that already has a
# release, to repair a release whose assets never landed. Re-running the failed
# run is not a repair: release-please reports release_created=false for a tag
# that already exists, so both build jobs skip. A dispatch skips release-please
# outright, so repairing one release can never mint the next version.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild assets for, e.g. v0.9.1"
        required: true
        type: string

permissions:
  contents: write # release-please: open/update the Release PR and create the release/tag; goreleaser: upload assets
  pull-requests: write # release-please: manage the Release PR
  packages: write # goreleaser: push the image to ghcr.io
  id-token: write # goreleaser: keyless cosign signing via GitHub OIDC

env:
  GO_VERSION: "1.27.1"
  # Kept in lockstep with .github/workflows/ci.yml and .mise.toml.
  GORELEASER_VERSION: "v2.18.2"
  ZIG_VERSION: "0.14.0"
  ZIG_SHA256: "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish == 'true' }}
      tag_name: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        # config-file and manifest-file default to release-please-config.json
        # and .release-please-manifest.json at the repo root.
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag to build
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.rp.outputs.release_created }}
          RELEASE_TAG: ${{ steps.rp.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          elif [ "$RELEASE_CREATED" != "true" ]; then
            tag=""
          fi
          # Dispatch only: a typo'd tag would otherwise fail at the publish
          # step, after both runners have burned minutes on the build matrix.
          # The release path trusts release-please and is left unvalidated —
          # ls-remote against a tag it just created is a needless flake risk.
          if [ -n "$DISPATCH_TAG" ]; then
            if ! git ls-remote --exit-code --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist"
              exit 1
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::no GitHub release for $tag; assets have nowhere to land"
              exit 1
            fi
          fi
          echo "publish=$([ -n "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  goreleaser-darwin:
    name: goreleaser (darwin)
    needs: release-please
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact tagged commit, not the branch head.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0
      - name: goreleaser release (darwin)
        # f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 = goreleaser-action v7
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # The host-GOOS skip filters in .goreleaser.yaml make this run build
          # darwin targets only. No publish/docker here: this job produces the
          # darwin archives, SBOMs and checksum slice for the ubuntu job to
          # merge into the release.
          args: release --clean --skip=publish,docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: upload darwin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin-dist
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sbom.spdx.json
            dist/checksums.txt

  goreleaser:
    name: goreleaser (linux + publish)
    needs: [release-please, goreleaser-darwin]
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact tagged commit, not the branch head.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4
      - name: install zig (cross C compiler for the CGO matrix)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0
      # Exact pin: upstream ships v4.x.y tags but no floating `v4` major tag, so
      # `@v4` fails to resolve and takes the publish job down before goreleaser
      # ever runs. Dependabot bumps this.
      - name: install cosign (keyless signing)
        uses: sigstore/cosign-installer@v4.1.2
      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser release (linux + publish)
        # f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 = goreleaser-action v7
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: download darwin artifacts
        uses: actions/download-artifact@v8
        with:
          name: darwin-dist
          path: dist-darwin
      - name: merge checksums and sign (covers every archive by digest)
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # goreleaser just published its linux-only checksums.txt, unsigned
          # (signing lives in this step). Swap in the merged file before
          # signing so the release never holds a partial final-looking list
          # for longer than one step.
          cat dist/checksums.txt dist-darwin/checksums.txt > /tmp/checksums.txt.merged
          mv /tmp/checksums.txt.merged dist/checksums.txt
          cosign sign-blob \
            "--bundle=dist/checksums.txt.sigstore.json" \
            dist/checksums.txt \
            --yes
      - name: upload darwin assets and signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --clobber \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json \
            dist-darwin/*.tar.gz \
            dist-darwin/*.sbom.spdx.json
