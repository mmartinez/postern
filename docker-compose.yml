# Example deployment: postern as a credential-brokering proxy.
#
# The service-account token is delivered as a Docker secret (mounted read-only
# at /run/secrets/op_token) — never baked into the image or its environment.
# The CA is generated once by the `bootstrap` one-shot below and mounted
# read-only thereafter (postern only reads it to sign per-host leaves in memory;
# it never writes the CA at runtime).
#
# Usage:
#   mkdir -p postern-ca
#   export POSTERN_UID="$(id -u)" POSTERN_GID="$(id -g)"
#   docker compose run --rm bootstrap   # one-time: generate the CA as your uid
#   docker compose up -d                # run the proxy
#
# Then distribute ./postern-ca/.postern/ca.pem to your agents and set
# HTTPS_PROXY + SSL_CERT_FILE (NODE_EXTRA_CA_CERTS for Node). See the README.
services:
  # One-shot CA bootstrap. Behind a profile so `compose up` skips it; invoke it
  # explicitly with `compose run --rm bootstrap`. Runs as your uid so the CA it
  # writes is readable by the proxy service (which runs as the same uid).
  bootstrap:
    image: ghcr.io/mmartinez/postern:latest
    profiles: ["bootstrap"]
    user: "${POSTERN_UID:-1000}:${POSTERN_GID:-1000}"
    environment:
      HOME: /data # postern keeps its CA under $HOME/.postern
    volumes:
      - ./postern-ca:/data
    command: ["ca", "install"]

  postern:
    image: ghcr.io/mmartinez/postern:latest
    user: "${POSTERN_UID:-1000}:${POSTERN_GID:-1000}"
    environment:
      HOME: /data
    command: ["server", "--config", "/etc/postern/config.yaml"]
    ports:
      - "1701:1701"
    # The admin listener (proxy.admin_listen in the config) is loopback-only
    # inside the container by design, so it is deliberately NOT published:
    # a published port would require binding a non-loopback address, which
    # validation rejects. Probes must run inside the container — see the
    # healthcheck below. `expose` documents the port for humans and tools.
    expose:
      - "1702"
    # distroless ships no shell/curl/wget, so the probe is postern's own
    # `server healthcheck` subcommand: GET /healthz, exit 0 only on 200.
    healthcheck:
      test: ["CMD", "/usr/local/bin/postern", "server", "healthcheck", "--addr", "127.0.0.1:1702"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./postern-ca:/data:ro # the CA, read-only (generated by the bootstrap one-shot)
      - ./config.yaml:/etc/postern/config.yaml:ro
      # The mounted config must set proxy.admin_listen (e.g. 127.0.0.1:1702)
      # or the healthcheck has nothing to probe; `postern config init` writes
      # a starter that already does.
    secrets:
      - op_token
    restart: unless-stopped

secrets:
  op_token:
    # A 0600 file holding the service-account token. Never commit it.
    file: ./op_token
