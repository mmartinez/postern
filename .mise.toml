# Toolchain pins — single source of truth for the devcontainer and CI.
# Bump versions deliberately; lockstep with .github/workflows/ci.yml matrix.

[tools]
go             = "1.26.8"
golangci-lint  = "2.14"
gofumpt        = "0.12"
lefthook       = "2.1"
gitleaks       = "8.30"
goreleaser     = "2.18"
# Release-only tooling. syft generates SBOMs during a goreleaser run; zig is
# the C cross-compiler for the CGO build matrix — the credential SDK
# (internal/credstore/onepassword) forces CGO_ENABLED=1, so a stock gcc cannot
# target the non-host arch. See .goreleaser.yaml.
syft           = "1.54"
# Exact pin: upstream renamed the release tarballs in 0.14.1
# (zig-linux-x86_64-<v> -> zig-x86_64-linux-<v>) and mise's core plugin still
# builds the pre-rename URL, so 0.14.1 and every later release (0.15.x included)
# 404. Moving off 0.14.0 means installing zig outside mise's core plugin.
zig            = "0.14.0"

# govulncheck and go-licenses are installed via `go install` in the devcontainer's
# postCreateCommand. They aren't in the mise core registry and mise's go: backend
# is still experimental.

[env]
# Honor caches inside the devcontainer's named volumes.
GOPATH      = "/home/dev/go"
GOMODCACHE  = "/home/dev/go/pkg/mod"
GOCACHE     = "/home/dev/.cache/go-build"
