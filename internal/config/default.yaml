# postern configuration
# ----------------------
# Default config written by `postern config init`. Edit the rules: section
# to broker credentials for the APIs your agent calls. The token: and
# proxy: sections are usually fine as-is for local development.
#
# Schema reference (every field): docs/configuration.md.
#
# Hot reload: postern watches this file and reloads on save. Bad configs
# are rejected with line numbers; the running config keeps serving.

token:
  # auto | keychain | env | file. "auto" tries file → env → keychain in order.
  source: auto
  # Environment variable consulted when source is "auto" or "env".
  env_var: OP_SERVICE_ACCOUNT_TOKEN
  # Path to a 0600 token file (e.g. /run/secrets/op_token in container deployments).
  file: ""
  # Account label used when storing/retrieving from the OS keychain.
  keychain_account: default

proxy:
  # host:port the proxy listens on. Set HTTPS_PROXY to this in your agent shell.
  listen: 127.0.0.1:1701
  # Credential cache. Resolution is a background concern: the request path reads
  # from this cache and never blocks on the vault, concurrent misses collapse
  # into one vault call, and a transient vault error keeps serving the
  # last-known-good value instead of failing closed. Tuned for long-lived tokens.
  # (The legacy scalar `cache_ttl: <dur>` is still accepted as an alias for ttl.)
  cache:
    ttl: 1h             # nominal freshness window
    refresh_ahead: 45m  # refresh asynchronously once a value reaches this age
    max_stale: 24h      # keep serving a cached value this long if refreshes fail
  # What to do when no rule matches an outbound request.
  # passthrough = forward unchanged. block = refuse with 502.
  on_no_match: passthrough

rules:
  - host: api.anthropic.com
    secret_ref: op://Agents/Anthropic/api_key
    inject:
      type: header
      name: x-api-key
      template: "{{ CREDENTIAL }}"

  - host: api.openai.com
    secret_ref: op://Agents/OpenAI/api_key
    inject:
      type: header
      name: authorization
      template: "Bearer {{ CREDENTIAL }}"

  - host: api.github.com
    secret_ref: op://Agents/GitHub/pat
    inject:
      type: header
      name: authorization
      template: "Bearer {{ CREDENTIAL }}"

  # Placeholder routing: let several agents share one host rule, each presenting
  # its own token. The token selects which secret to inject AND is the value
  # postern replaces in place. Use instead of secret_ref + inject.name (mutually
  # exclusive). Pick high-entropy tokens: a token is effectively the only thing
  # separating one agent's secret from another's. Unknown or ambiguous tokens
  # fail closed (502); the token value is never logged (only the route name).
  # - host: api.telegram.org
  #   inject:
  #     type: placeholder
  #     in: [header]
  #     template: "{{ CREDENTIAL }}"   # agent sends "Authorization: Bearer <token>"
  #   routes:
  #     - name: max
  #       token: tg_max_8Kq2Lp9wZ
  #       secret_ref: op://Agents/telegram-max/token
  #     - name: john
  #       token: tg_john_3Rt7Yx1mQ
  #       secret_ref: op://Agents/telegram-john/token

# OAuth2 (Bearer): postern mints/refreshes a short-lived access token from
# long-lived client credentials and injects it as "Authorization: Bearer ...".
# This uses the credstores: form (mutually exclusive with the top-level token:
# block above), so it is shown fully commented. grant_type is required and
# explicit; a refresh_token: block is required for, and only for, the
# refresh_token grant. See docs/providers.md (OAuth2).
#
# credstores:
#   - name: corp                              # client_credentials grant
#     provider: oauth2
#     token:                                  # the OAuth2 client secret
#       source: env
#       env_var: CORP_OAUTH_CLIENT_SECRET
#     settings:
#       token_url: https://idp.example.com/oauth2/token
#       client_id: postern-agent
#       grant_type: client_credentials
#       scope: "read write"                   # optional, space-separated
#       auth_style: basic                     # basic (default) | post
