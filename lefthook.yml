# Local git hooks — runs inside the devcontainer (where lefthook + go tooling live).
# Installed automatically by .devcontainer/post-create.sh -> `lefthook install`.
# Never bypass with --no-verify (PRD §13.8 hard rule).

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: |
        out=$(gofumpt -l -d {staged_files})
        if [ -n "$out" ]; then
          echo "gofumpt would reformat these files:"
          echo "$out"
          echo
          echo "run 'make fmt' to fix"
          exit 1
        fi

    quick-lint:
      glob: "*.go"
      run: golangci-lint run --fast --new-from-rev=HEAD {staged_files}

    secret-scan:
      run: gitleaks protect --staged --redact --config .gitleaks.toml

    banned-strings:
      run: bash scripts/check-banned-strings.sh {staged_files}

commit-msg:
  commands:
    conventional:
      # Conventional Commits: type(scope?): subject. Allowed types per SPEC §7.1.
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf)(\([^)]+\))?: .+' || {
          echo "commit message must follow Conventional Commits:"
          echo "  <type>(<scope>)?: <subject>"
          echo "allowed types: feat|fix|chore|docs|test|refactor|build|ci|perf"
          exit 1
        }

pre-push:
  parallel: false
  commands:
    full-lint:
      run: golangci-lint run ./...
    typecheck:
      run: go build ./...
    vet:
      run: go vet ./...
    test:
      run: go test -race -short ./...
    vuln:
      run: govulncheck ./...
