# Local git hooks — runs inside the devcontainer (where lefthook + go tooling live).
# Installed automatically by .devcontainer/post-create.sh -> `lefthook install`.
# Never bypass with --no-verify; the hooks exist to catch bugs and leaks early.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: |
        out=$(gofumpt -extra -l -d {staged_files})
        if [ -n "$out" ]; then
          echo "gofumpt would reformat these files:"
          echo "$out"
          echo
          echo "run 'make fmt' to fix"
          exit 1
        fi

    quick-lint:
      glob: "*.go"
      # golangci-lint accepts package paths, not arbitrary file lists. Derive
      # the unique set of changed package dirs from the staged file list and
      # pass those to --fast-only (v2 replacement for --fast), restricted to
      # new findings (--new-from-rev=HEAD). --build-tags=e2e because every
      # file in test/e2e carries that tag; without it a commit touching only
      # that package fails with "build constraints exclude all Go files".
      run: |
        dirs=$(printf '%s\n' {staged_files} | xargs -n1 dirname | sort -u | sed 's|^|./|')
        if [ -z "$dirs" ]; then exit 0; fi
        # shellcheck disable=SC2086 # word-split intended
        golangci-lint run --fast-only --new-from-rev=HEAD --build-tags=e2e $dirs

    secret-scan:
      run: gitleaks protect --staged --redact --config .gitleaks.toml

    banned-strings:
      run: bash scripts/check-banned-strings.sh {staged_files}

    publication:
      run: node scripts/check-publication.mjs --staged

commit-msg:
  commands:
    publication:
      run: node scripts/check-publication.mjs --message-file "{1}"
    conventional:
      # Conventional Commits: type(scope?): subject.
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci|perf)(\([^)]+\))?: .+' || {
          echo "commit message must follow Conventional Commits:"
          echo "  <type>(<scope>)?: <subject>"
          echo "allowed types: feat|fix|chore|docs|test|refactor|build|ci|perf"
          exit 1
        }

pre-push:
  parallel: false
  scripts:
    publication.sh:
      runner: sh
      priority: 1
      use_stdin: true
  commands:
    full-lint:
      run: golangci-lint run ./...
    typecheck:
      run: go build ./...
    vet:
      run: go vet ./...
    test:
      run: go test -race -short ./...
    vuln:
      run: govulncheck ./...
